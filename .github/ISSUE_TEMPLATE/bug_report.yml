name: Bug report
description: Report a bug in AFKLLM
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the issue.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I am on the latest AFKLLM release (or a current `npm run dev` build).
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 10
        - Windows 11
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AFKLLM version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Steps to reproduce, expected vs actual behavior. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Settings → Logs / console output if relevant.
      render: shell
